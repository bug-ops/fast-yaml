[package]
name = "fast-yaml-nodejs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fast YAML parser for Node.js, powered by Rust"
keywords = ["yaml", "parser", "nodejs", "napi", "performance"]
categories = ["parsing", "encoding"]
publish = false  # Node.js bindings published to npm, not crates.io

[lib]
crate-type = ["cdylib"]

[features]
default = ["json-output"]
json-output = ["fast-yaml-linter/json-output"]
# Exposes panicking exports for tests; must not be enabled in release builds
test-panic = []

[dependencies]
fast-yaml-core = { workspace = true }
fast-yaml-linter = { workspace = true }
fast-yaml-parallel = { workspace = true }
napi = { workspace = true, features = ["napi8", "error_anyhow", "serde-json"] }
serde_json = { workspace = true }
napi-derive = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

# napi-rs generates its glue itself; hand-written unsafe is confined to rule_input.rs and parallel.rs
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
pedantic = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
