[package]
name = "fast-yaml-parallel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-threaded YAML processing with work-stealing parallelism"
readme = "README.md"
keywords = ["yaml", "parallel", "rayon", "performance", "parser"]
categories = ["parsing", "concurrency"]

[dependencies]
fast-yaml-core = { workspace = true }
rayon = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["fs", "std"] }
xattr = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
exacl = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
proptest = { workspace = true }
tempfile = { workspace = true }

[features]
tracing = ["dep:tracing"]

[[bench]]
name = "parallel_benchmark"
harness = false

[lints]
workspace = true
