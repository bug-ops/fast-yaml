name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security audit (Sundays at midnight UTC)
    - cron: '0 0 * * 0'

# Restrict permissions by default (principle of least privilege)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"
  RUSTUP_MAX_RETRIES: 10

# Cancel previous runs on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what files changed to skip irrelevant jobs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      nodejs: ${{ steps.filter.outputs.nodejs }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - '**/Cargo.toml'
              - 'Cargo.lock'
            python:
              - 'python/**'
              - 'crates/fast-yaml-core/**'
              - 'tests/**/*.py'
            nodejs:
              - 'nodejs/**'
              - 'crates/fast-yaml-core/**'
            ci:
              - '.github/workflows/**'

  # Format checks - one job per language so downstream jobs can depend on the relevant one
  format-rust:
    name: Format (rust)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check Rust formatting
        run: cargo +nightly fmt --all -- --check

  format-python:
    name: Format (python)
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Check Python formatting
        run: cd python && uv run ruff format --check .

  format-nodejs:
    name: Format (nodejs)
    needs: [changes]
    if: needs.changes.outputs.nodejs == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: nodejs/pnpm-lock.yaml

      - name: Install NodeJS dependencies
        run: cd nodejs && pnpm install --no-frozen-lockfile

      - name: Check NodeJS formatting
        run: cd nodejs && pnpm run format:check

  # Clippy linting - runs in parallel with format; gate for all test jobs
  lint:
    name: Clippy Lint
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy


      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "clippy"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install SARIF tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: clippy-sarif,sarif-fmt,cargo-hack

      # Single clippy run with SARIF output
      - name: Run Clippy with SARIF
        run: |
          cargo clippy --workspace --all-targets --all-features --message-format=json -- -D warnings 2>&1 | \
          clippy-sarif | tee clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Verify Clippy passes
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Clippy feature powerset
        run: cargo hack clippy --feature-powerset --all-targets -p fast-yaml-cli -p fast-yaml-linter -p fast-yaml-core -p fast-yaml-parallel -- -D warnings

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: clippy-results.sarif
          wait-for-processing: true

      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps


  # Security auditing - runs in parallel with everything
  security:
    name: Security Audit
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Install security tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "security"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run cargo deny
        run: cargo deny check

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-semver-checks

      - name: Check SemVer compliance
        run: cargo semver-checks check-release --package fast-yaml-core || true

  # MSRV check - runs in parallel
  msrv:
    name: Check MSRV (1.91.0)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.91.0
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.91.0"


      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "msrv"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check with MSRV
        run: cargo check --workspace --all-targets


  # Cross-platform Rust tests
  test-rust:
    name: Test Rust (${{ matrix.os }}${{ matrix.rust == 'beta' && ', beta' || '' }})
    needs: [changes, format-rust, lint]
    # !cancelled() lets skipped (path-filtered) gates through; any failed gate blocks
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: beta
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.rust }}


      - name: Install nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "test-${{ matrix.os }}-${{ matrix.rust }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build workspace
        # Exclude FFI bindings (tested separately with their runtimes)
        run: cargo build --workspace --all-targets --exclude fast-yaml --exclude fast-yaml-nodejs

      - name: Run tests
        run: cargo nextest run --workspace --exclude fast-yaml --exclude fast-yaml-nodejs

      - name: Run doctests
        # nextest does not run doctests
        run: cargo test --doc --workspace --exclude fast-yaml --exclude fast-yaml-nodejs


  # Core crate alone: workspace-wide runs unify the `arena` feature on, hiding no-arena cfg regressions
  test-core-no-arena:
    name: Test Core (no arena)
    needs: [changes, format-rust, lint]
    # !cancelled() lets skipped (path-filtered) gates through; any failed gate blocks
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy

      - name: Install nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "core-no-arena"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy (default features)
        run: cargo clippy -p fast-yaml-core --all-targets -- -D warnings

      - name: Run tests
        run: cargo nextest run -p fast-yaml-core

      - name: Run doctests
        # nextest does not run doctests
        run: cargo test --doc -p fast-yaml-core

  # Code coverage (Linux only)
  coverage:
    name: Code Coverage
    needs: [changes, format-rust, lint]
    # !cancelled() lets skipped (path-filtered) gates through; any failed gate blocks
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable


      - name: Install coverage tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov,nextest

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "coverage"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate coverage
        run: cargo llvm-cov nextest --workspace --exclude fast-yaml --exclude fast-yaml-nodejs --lcov --output-path lcov.info

      - name: Upload to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          flags: rust
          name: rust-coverage
          verbose: true

      - name: Archive coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-report
          path: lcov.info
          retention-days: 30


  # Python quality checks - runs in parallel
  python-quality:
    name: Python Quality Checks
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: cd python && uv sync

      - name: Run type checking
        run: cd python && uv run mypy fast_yaml/
        continue-on-error: true

      - name: Run linting
        run: cd python && uv run ruff check .

  # NodeJS quality checks - runs in parallel
  nodejs-quality:
    name: NodeJS Quality Checks
    needs: [changes]
    if: needs.changes.outputs.nodejs == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: nodejs/pnpm-lock.yaml

      - name: Install NodeJS dependencies
        run: cd nodejs && pnpm install --no-frozen-lockfile

      - name: Run security audit
        run: |
          cd nodejs
          # Fail on high and critical vulnerabilities
          pnpm audit --audit-level=high || {
            echo "Security vulnerabilities found. Run 'pnpm audit' locally to see details."
            echo "To fix automatically: pnpm audit fix"
            exit 1
          }

      - name: Run linting
        run: cd nodejs && pnpm run lint

      - name: Run type checking
        run: cd nodejs && pnpm run typecheck

  # Python bindings tests (optimized matrix)
  test-python:
    name: Test Python (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: [changes, format-python, python-quality, lint]
    # !cancelled() lets skipped (path-filtered) gates through; any failed gate blocks
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # abi3 wheel is identical across versions: test the floor and the newest release
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.14'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable


      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "python-${{ matrix.os }}-${{ steps.setup-python.outputs.python-version }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: cd python && uv sync

      - name: Build fy binary
        run: cargo build --bin fy

      - name: Build Python extension
        run: cd python && uv run maturin develop

      - name: Checkout yaml-test-suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yaml/yaml-test-suite
          ref: data-2022-01-17
          path: yaml-test-suite
          depth: 1
          persist-credentials: false

      - name: Run Python tests
        run: cd python && uv run pytest tests/ -v
        env:
          YAML_TEST_SUITE_PATH: ${{ github.workspace }}/yaml-test-suite
          FY_BIN: ${{ github.workspace }}/target/debug/fy${{ runner.os == 'Windows' && '.exe' || '' }}


  # NodeJS bindings tests
  test-nodejs:
    name: Test NodeJS (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: [changes, format-nodejs, nodejs-quality, lint]
    # !cancelled() lets skipped (path-filtered) gates through; any failed gate blocks
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.nodejs == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: min supported LTS and latest LTS
          - os: ubuntu-latest
            node-version: '22'
          - os: ubuntu-latest
            node-version: '24'
          # macOS: latest LTS
          - os: macos-latest
            node-version: '24'
          # Windows: latest LTS
          - os: windows-latest
            node-version: '24'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: nodejs/pnpm-lock.yaml

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "nodejs-${{ matrix.os }}-${{ matrix.node-version }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install NodeJS dependencies
        run: cd nodejs && pnpm install --no-frozen-lockfile

      - name: Build fy binary
        run: cargo build --bin fy

      - name: Build NodeJS extension
        run: cd nodejs && pnpm run build:test

      - name: Run NodeJS tests
        run: cd nodejs && pnpm test
        env:
          FY_BIN: ${{ github.workspace }}/target/debug/fy${{ runner.os == 'Windows' && '.exe' || '' }}


  # Python coverage (Linux only)
  python-coverage:
    name: Python Coverage
    needs: [changes, format-python, python-quality, lint]
    # !cancelled() lets skipped (path-filtered) gates through; any failed gate blocks
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable


      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "python-coverage"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: cd python && uv sync

      - name: Build fy binary
        run: cargo build --bin fy

      - name: Build Python extension
        run: cd python && uv run maturin develop

      - name: Checkout yaml-test-suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yaml/yaml-test-suite
          ref: data-2022-01-17
          path: yaml-test-suite
          depth: 1
          persist-credentials: false

      - name: Run tests with coverage
        run: cd python && uv run pytest tests/ -v --cov=fast_yaml --cov-report=xml:coverage.xml
        env:
          YAML_TEST_SUITE_PATH: ${{ github.workspace }}/yaml-test-suite
          FY_BIN: ${{ github.workspace }}/target/debug/fy

      - name: Upload Python coverage to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: python/coverage.xml
          flags: python
          name: python-coverage
          verbose: true


  # NodeJS coverage (Linux only)
  nodejs-coverage:
    name: NodeJS Coverage
    needs: [changes, format-nodejs, nodejs-quality, lint]
    # !cancelled() lets skipped (path-filtered) gates through; any failed gate blocks
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.nodejs == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: nodejs/pnpm-lock.yaml

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "nodejs-coverage"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install NodeJS dependencies
        run: cd nodejs && pnpm install --no-frozen-lockfile

      - name: Build fy binary
        run: cargo build --bin fy

      - name: Build NodeJS extension
        run: cd nodejs && pnpm run build:test

      - name: Run tests with coverage
        run: cd nodejs && pnpm run test:coverage
        env:
          FY_BIN: ${{ github.workspace }}/target/debug/fy

      - name: Upload NodeJS coverage to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: nodejs/coverage/lcov.info
          flags: nodejs
          name: nodejs-coverage
          verbose: true


  # NodeJS release build (main branch only)
  nodejs-build:
    name: NodeJS Build (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    needs: [test-nodejs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: nodejs/pnpm-lock.yaml

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "nodejs-build-${{ matrix.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install NodeJS dependencies
        run: cd nodejs && pnpm install --no-frozen-lockfile

      - name: Build release
        run: cd nodejs && pnpm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodejs-binaries-${{ matrix.os }}
          path: nodejs/*.node
          retention-days: 7


  # Release build check (main branch only)
  release-build:
    name: Release Build Check
    if: github.ref == 'refs/heads/main'
    needs: [test-rust]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable


      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "release"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release
        run: cargo build --workspace --release --exclude fast-yaml --exclude fast-yaml-nodejs

      - name: Check binary sizes
        run: |
          find target/release -maxdepth 1 -type f -regex '.*\.\(so\|dylib\|dll\|a\|rlib\)' -exec ls -lh {} +
          du -sh target/release/


  # All checks passed - required for branch protection
  ci-success:
    name: CI Success
    needs: [format-rust, format-python, format-nodejs, lint, security, test-rust, test-core-no-arena, coverage, msrv, test-python, python-quality, python-coverage, test-nodejs, nodejs-quality, nodejs-coverage]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "Format (rust): ${{ needs.format-rust.result }}"
          echo "Format (python): ${{ needs.format-python.result }}"
          echo "Format (nodejs): ${{ needs.format-nodejs.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Test Rust: ${{ needs.test-rust.result }}"
          echo "Test Core (no arena): ${{ needs.test-core-no-arena.result }}"
          echo "Coverage: ${{ needs.coverage.result }}"
          echo "MSRV: ${{ needs.msrv.result }}"
          echo "Test Python: ${{ needs.test-python.result }}"
          echo "Python Quality: ${{ needs.python-quality.result }}"
          echo "Python Coverage: ${{ needs.python-coverage.result }}"
          echo "Test NodeJS: ${{ needs.test-nodejs.result }}"
          echo "NodeJS Quality: ${{ needs.nodejs-quality.result }}"
          echo "NodeJS Coverage: ${{ needs.nodejs-coverage.result }}"

          # Docs-only changes (specs/, *.md, docs/) match no filter, so every job is skipped
          # All jobs can be skipped if the path filter excludes them
          for result in "${{ needs.format-rust.result }}" "${{ needs.format-python.result }}" \
                        "${{ needs.format-nodejs.result }}" "${{ needs.lint.result }}" "${{ needs.security.result }}" \
                        "${{ needs.test-rust.result }}" "${{ needs.test-core-no-arena.result }}" \
                        "${{ needs.coverage.result }}" \
                        "${{ needs.msrv.result }}" "${{ needs.test-python.result }}" \
                        "${{ needs.python-quality.result }}" "${{ needs.python-coverage.result }}" \
                        "${{ needs.test-nodejs.result }}" "${{ needs.nodejs-quality.result }}" \
                        "${{ needs.nodejs-coverage.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "❌ A required job failed: $result"
              exit 1
            fi
          done

          echo "✅ All CI checks passed successfully!"
