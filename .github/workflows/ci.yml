name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security audit (Sundays at midnight UTC)
    - cron: '0 0 * * 0'

# Restrict permissions by default (principle of least privilege)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"
  RUSTUP_MAX_RETRIES: 10
  # Fail loudly when a task needs a tool its job did not list in install_args
  MISE_TASK_RUN_AUTO_INSTALL: "false"

# Cancel previous runs on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what files changed to skip irrelevant jobs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      nodejs: ${{ steps.filter.outputs.nodejs }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - '**/Cargo.toml'
              - 'Cargo.lock'
            python:
              - 'python/**'
              - 'crates/fast-yaml-core/**'
              - 'tests/**/*.py'
            nodejs:
              - 'nodejs/**'
              - 'crates/fast-yaml-core/**'
            ci:
              - '.github/workflows/**'
              - 'mise.toml'
              - 'mise.*.toml'
              - 'mise.lock'
              - 'mise.*.lock'

  # Rust format and clippy in one job: a 10s nightly install is cheaper than a separate runner, and this job gates the tests either way
  # mise-action steps: MISE_SAFE applies to the install step only, because safe mode disables `mise run`
  lint:
    name: Lint (rust)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: rustfmt

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "clippy"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          version: 2026.10.25
          install: false

      - name: Check Rust formatting
        run: mise run fmt:check:rust

      # clippy-sarif and sarif-fmt have no mise registry entry and share one repository with several tag prefixes
      # The steps below run after a failed format check so one failure does not hide the others
      - name: Install SARIF tools
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: clippy-sarif,sarif-fmt

      # Single clippy run with SARIF output
      - name: Run Clippy with SARIF
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --workspace --all-targets --all-features --message-format=json -- -D warnings 2>&1 | \
          clippy-sarif | tee clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Verify Clippy passes
        if: ${{ !cancelled() }}
        run: mise run lint:clippy

      - name: Upload SARIF to GitHub
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: clippy-results.sarif
          wait-for-processing: true

      - name: Check documentation
        if: ${{ !cancelled() }}
        run: mise run doc

  # Feature powerset is ~65s of the lint gate (main medians), so it runs beside the tests instead of in front of them
  clippy-powerset:
    name: Clippy Feature Powerset
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "clippy-powerset"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_SAFE: "1"
        with:
          cache: false
          version: 2026.10.25
          install_args: github:taiki-e/cargo-hack

      - name: Clippy feature powerset
        run: mise run lint:clippy-hack


  # Security auditing - runs in parallel with everything
  security:
    name: Security Audit
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_SAFE: "1"
        with:
          cache: false
          version: 2026.10.25
          install_args: aqua:EmbarkStudios/cargo-deny github:obi1kenobi/cargo-semver-checks

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "security"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run cargo deny
        run: mise run deny

      - name: Check SemVer compliance
        run: mise run semver

  # MSRV check - runs in parallel
  msrv:
    name: Check MSRV (1.91.0)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.91.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.91.0"


      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "msrv"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check with MSRV
        run: cargo check --workspace --all-targets


  # Cross-platform Rust tests
  test-rust:
    name: Test Rust (${{ matrix.os }}${{ matrix.rust == 'beta' && ', beta' || '' }})
    needs: [changes, lint]
    # !cancelled() lets skipped (path-filtered) gates through; any failed gate blocks
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: beta
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_SAFE: "1"
        with:
          cache: false
          version: 2026.10.25
          install_args: github:nextest-rs/nextest[version_prefix=cargo-nextest-]

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "test-${{ matrix.os }}-${{ matrix.rust }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Build, nextest and doctests; FFI bindings are excluded (tested separately with their runtimes)
      - name: Build and test workspace
        run: mise run test:rust


  # Core crate alone: workspace-wide runs unify the `arena` feature on, hiding no-arena cfg regressions
  test-core-no-arena:
    name: Test Core (no arena)
    needs: [changes, lint]
    # !cancelled() lets skipped (path-filtered) gates through; any failed gate blocks
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy

      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_SAFE: "1"
        with:
          cache: false
          version: 2026.10.25
          install_args: github:nextest-rs/nextest[version_prefix=cargo-nextest-]

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "core-no-arena"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Clippy (default features), nextest and doctests
      - name: Lint and test core
        run: mise run test:core-no-arena

  # Code coverage (Linux only)
  coverage:
    name: Code Coverage
    needs: [changes, lint]
    # !cancelled() lets skipped (path-filtered) gates through; any failed gate blocks
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_SAFE: "1"
        with:
          cache: false
          version: 2026.10.25
          install_args: aqua:taiki-e/cargo-llvm-cov github:nextest-rs/nextest[version_prefix=cargo-nextest-]

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "coverage"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate coverage
        run: mise run coverage:rust

      - name: Upload to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          flags: rust
          name: rust-coverage
          verbose: true

      - name: Archive coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage-report
          path: lcov.info
          retention-days: 30


  # Python format and lint in one job: both spend ~60s in the same uv sync (extension build), which now runs once
  python-quality:
    name: Python Quality Checks
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_SAFE: "1"
        with:
          cache: false
          version: 2026.10.25
          install_args: python uv

      # uv sync, mypy (non-blocking) and ruff check
      - name: Run type checking and linting
        run: mise run lint:python

      - name: Check Python formatting
        if: ${{ !cancelled() }}
        run: mise run fmt:check:python

  # NodeJS format and quality in one job: format alone was ~20s, mostly setup
  nodejs-quality:
    name: NodeJS Quality Checks
    needs: [changes]
    if: needs.changes.outputs.nodejs == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_SAFE: "1"
        with:
          cache: false
          version: 2026.10.25
          install_args: node pnpm

      - name: Check NodeJS formatting
        run: mise run fmt:check:nodejs

      # Fails on high and critical vulnerabilities
      - name: Run security audit
        run: mise run audit:nodejs

      - name: Run linting and type checking
        run: mise run lint:nodejs

  # Python bindings tests (optimized matrix)
  test-python:
    name: Test Python (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: [changes, python-quality, lint]
    # !cancelled() lets skipped (path-filtered) gates through; any failed gate blocks
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Selects mise.<env>.toml and its own lockfile, so the tested Python stays lock-pinned
      MISE_ENV: ${{ matrix.mise-env }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # abi3 wheel is identical across versions: test the floor and the newest release
          - os: ubuntu-latest
            python-version: '3.10'
            mise-env: py310
          - os: ubuntu-latest
            python-version: '3.14'
            mise-env: py314
          - os: macos-latest
            python-version: '3.14'
            mise-env: py314
          - os: windows-latest
            python-version: '3.14'
            mise-env: py314

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up mise (Python ${{ matrix.python-version }})
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_SAFE: "1"
        with:
          cache: false
          version: 2026.10.25
          install_args: python uv

      # Checks the interpreter uv resolves for the project, so an ignored MISE_ENV or a uv-downloaded Python cannot pass
      - name: Assert Python version
        shell: bash
        run: |
          PY="$(cd python && uv python find)"
          GOT="$("$PY" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          test "$GOT" = "$EXPECTED_PYTHON" || { echo "Expected Python $EXPECTED_PYTHON, got $GOT ($PY)"; exit 1; }
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "python-${{ matrix.os }}-${{ matrix.python-version }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Checkout yaml-test-suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yaml/yaml-test-suite
          ref: data-2022-01-17
          path: yaml-test-suite
          depth: 1
          persist-credentials: false

      # test:python builds fy, then the extension (uv sync, maturin develop), then runs pytest
      - name: Build and run Python tests
        run: mise run test:python
        env:
          YAML_TEST_SUITE_PATH: ${{ github.workspace }}/yaml-test-suite


  # NodeJS bindings tests
  test-nodejs:
    name: Test NodeJS (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: [changes, nodejs-quality, lint]
    # !cancelled() lets skipped (path-filtered) gates through; any failed gate blocks
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.nodejs == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: min supported LTS and latest LTS
          - os: ubuntu-latest
            node-version: '22'
            mise-env: node22
          - os: ubuntu-latest
            node-version: '24'
          # macOS: latest LTS
          - os: macos-latest
            node-version: '24'
          # Windows: latest LTS
          - os: windows-latest
            node-version: '24'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # node22 selects mise.node22.toml and its own lockfile; default legs leave MISE_ENV unset
      - name: Select mise environment
        if: ${{ matrix.mise-env }}
        shell: bash
        run: echo "MISE_ENV=$MISE_ENV_NAME" >> "$GITHUB_ENV"
        env:
          MISE_ENV_NAME: ${{ matrix.mise-env }}

      - name: Set up mise (Node ${{ matrix.node-version }})
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_SAFE: "1"
        with:
          cache: false
          version: 2026.10.25
          install_args: node pnpm

      - name: Assert Node major version
        shell: bash
        run: test "$(node --version | cut -d. -f1)" = "v${EXPECTED_NODE}" || { echo "Expected Node ${EXPECTED_NODE}, got $(node --version)"; exit 1; }
        env:
          EXPECTED_NODE: ${{ matrix.node-version }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "nodejs-${{ matrix.os }}-${{ matrix.node-version }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # test:nodejs builds fy, then the addon (pnpm install, napi build:test), then runs the tests
      - name: Build and run NodeJS tests
        run: mise run test:nodejs


  # Python coverage (Linux only)
  python-coverage:
    name: Python Coverage
    needs: [changes, python-quality, lint]
    # !cancelled() lets skipped (path-filtered) gates through; any failed gate blocks
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_SAFE: "1"
        with:
          cache: false
          version: 2026.10.25
          install_args: python uv

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "python-coverage"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Checkout yaml-test-suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yaml/yaml-test-suite
          ref: data-2022-01-17
          path: yaml-test-suite
          depth: 1
          persist-credentials: false

      - name: Build and run tests with coverage
        run: mise run coverage:python
        env:
          YAML_TEST_SUITE_PATH: ${{ github.workspace }}/yaml-test-suite

      - name: Upload Python coverage to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: python/coverage.xml
          flags: python
          name: python-coverage
          verbose: true


  # NodeJS coverage (Linux only)
  nodejs-coverage:
    name: NodeJS Coverage
    needs: [changes, nodejs-quality, lint]
    # !cancelled() lets skipped (path-filtered) gates through; any failed gate blocks
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.nodejs == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_SAFE: "1"
        with:
          cache: false
          version: 2026.10.25
          install_args: node pnpm

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "nodejs-coverage"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build and run tests with coverage
        run: mise run coverage:nodejs

      - name: Upload NodeJS coverage to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: nodejs/coverage/lcov.info
          flags: nodejs
          name: nodejs-coverage
          verbose: true


  # NodeJS release build (main branch only)
  nodejs-build:
    name: NodeJS Build (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    needs: [test-nodejs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_SAFE: "1"
        with:
          cache: false
          version: 2026.10.25
          install_args: node pnpm

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "nodejs-build-${{ matrix.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release
        run: mise run release:nodejs

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodejs-binaries-${{ matrix.os }}
          path: nodejs/*.node
          retention-days: 7


  # Release build check (main branch only)
  release-build:
    name: Release Build Check
    if: github.ref == 'refs/heads/main'
    needs: [test-rust]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable


      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "release"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release
        run: cargo build --workspace --release --exclude fast-yaml --exclude fast-yaml-nodejs

      - name: Check binary sizes
        run: |
          find target/release -maxdepth 1 -type f -regex '.*\.\(so\|dylib\|dll\|a\|rlib\)' -exec ls -lh {} +
          du -sh target/release/

  # All checks passed - required for branch protection
  ci-success:
    name: CI Success
    needs: [lint, clippy-powerset, security, test-rust, test-core-no-arena, coverage, msrv, test-python, python-quality, python-coverage, test-nodejs, nodejs-quality, nodejs-coverage]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "Lint (rust): ${{ needs.lint.result }}"
          echo "Clippy Feature Powerset: ${{ needs.clippy-powerset.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Test Rust: ${{ needs.test-rust.result }}"
          echo "Test Core (no arena): ${{ needs.test-core-no-arena.result }}"
          echo "Coverage: ${{ needs.coverage.result }}"
          echo "MSRV: ${{ needs.msrv.result }}"
          echo "Test Python: ${{ needs.test-python.result }}"
          echo "Python Quality: ${{ needs.python-quality.result }}"
          echo "Python Coverage: ${{ needs.python-coverage.result }}"
          echo "Test NodeJS: ${{ needs.test-nodejs.result }}"
          echo "NodeJS Quality: ${{ needs.nodejs-quality.result }}"
          echo "NodeJS Coverage: ${{ needs.nodejs-coverage.result }}"

          # Docs-only changes (specs/, *.md, docs/) match no filter, so every job is skipped
          # All jobs can be skipped if the path filter excludes them
          for result in "${{ needs.lint.result }}" "${{ needs.clippy-powerset.result }}" \
                        "${{ needs.security.result }}" \
                        "${{ needs.test-rust.result }}" "${{ needs.test-core-no-arena.result }}" \
                        "${{ needs.coverage.result }}" \
                        "${{ needs.msrv.result }}" "${{ needs.test-python.result }}" \
                        "${{ needs.python-quality.result }}" "${{ needs.python-coverage.result }}" \
                        "${{ needs.test-nodejs.result }}" "${{ needs.nodejs-quality.result }}" \
                        "${{ needs.nodejs-coverage.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "❌ A required job failed: $result"
              exit 1
            fi
          done

          echo "✅ All CI checks passed successfully!"
