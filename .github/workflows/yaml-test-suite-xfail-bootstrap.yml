name: yaml-test-suite xfail bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yaml/yaml-test-suite
          ref: data-2022-01-17
          path: yaml-test-suite
          depth: 1
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "yaml-test-suite-xfail-bootstrap"
          save-if: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: cd python && uv sync

      - name: Build Python extension
        run: cd python && uv run maturin develop

      - name: Generate xfail list
        env:
          YAML_TEST_SUITE_PATH: ${{ github.workspace }}/yaml-test-suite
        run: cd python && uv run python scripts/gen_yaml_test_suite_xfail.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yaml-test-suite-xfail
          path: python/tests/data/yaml_test_suite_xfail.txt
          retention-days: 14
