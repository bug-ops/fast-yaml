name: yaml-test-suite xfail bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yaml/yaml-test-suite
          ref: data-2022-01-17
          path: yaml-test-suite
          depth: 1
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "yaml-test-suite-xfail-bootstrap"
          save-if: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: cd python && uv sync

      - name: Build Python extension
        run: cd python && uv run maturin develop

      - name: Generate xfail list
        env:
          YAML_TEST_SUITE_PATH: ${{ github.workspace }}/yaml-test-suite
        run: cd python && uv run python scripts/gen_yaml_test_suite_xfail.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yaml-test-suite-xfail
          path: python/tests/data/yaml_test_suite_xfail.txt
          retention-days: 14
