name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - "scripts/fuzz-seed-corpus.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        default: "60"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [parse, format, lint, validate_differential]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Checkout yaml-test-suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yaml/yaml-test-suite
          ref: 6e6c296ae9c9d2d5c4134b4b64d01b29ac19ff6f # data-2022-01-17
          path: yaml-test-suite
          persist-credentials: false

      - name: Restore fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Seed corpus
        env:
          TARGET: ${{ matrix.target }}
        run: |
          scripts/fuzz-seed-corpus.sh
          mkdir -p "fuzz/corpus/${TARGET}"
          find yaml-test-suite -name in.yaml -type f -print0 |
            while IFS= read -r -d '' file; do
              cp "$file" "fuzz/corpus/${TARGET}/suite_$(printf '%s' "$file" | tr '/' '_')"
            done

      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '60' }}
          TARGET: ${{ matrix.target }}
        working-directory: fuzz
        run: cargo fuzz run "$TARGET" -- -max_total_time="$FUZZ_SECONDS" -timeout=10 -rss_limit_mb=2048

      - name: Upload crash artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
